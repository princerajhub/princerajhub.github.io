<h1 style="text-align:center;">📝 Notes App</h1>
<p style="text-align:center;">Yahan apne notes likho aur save karo</p>

<div style="max-width:400px; margin:30px auto; text-align:center;">
  <textarea id="note"
    placeholder="Yahan apna note likho..."
    style="width:100%; height:120px; padding:10px; border-radius:8px;">
  </textarea>

  <br><br>

  <button onclick="saveNote()" style="padding:10px 20px;">💾 Save</button>
  <button onclick="clearNote()" style="padding:10px 20px;">🗑 Clear</button>
</div>

<p style="text-align:center;">
  <a href="projects.html">← Back to Projects</a>
</p>

<script>
  const noteBox = document.getElementById("note");

  // Load saved note
  noteBox.value = localStorage.getItem("myNote") || "";

  function saveNote() {
    localStorage.setItem("myNote", noteBox.value);
    alert("Note saved!");
  }

  function clearNote() {
    localStorage.removeItem("myNote");
    noteBox.value = "";
  }
</script>

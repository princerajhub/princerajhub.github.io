<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timer | PrinceRaj Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c1224;--bg-2:#131b34;--card:#18213f;--line:#2a3560;--text:#eef1fb;--muted:#9aa5c8;--blue:#4cc9f0;--violet:#8b7bff;--amber:#ffb454;--green:#5ee6a0;--radius:18px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Space Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:6px}
.glow{position:fixed;inset:0;z-index:-1;overflow:hidden}
.glow span{position:absolute;border-radius:50%;filter:blur(90px);opacity:.33}
.glow span:nth-child(1){width:420px;height:420px;background:var(--violet);top:-120px;left:-100px;animation:drift 18s ease-in-out infinite alternate}
.glow span:nth-child(2){width:360px;height:360px;background:var(--blue);bottom:-120px;right:-80px;animation:drift 22s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(80px,60px) scale(1.15)}}
header{position:sticky;top:0;z-index:50;background:rgba(12,18,36,.75);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
nav{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:14px 22px}
.logo{font-weight:700;font-size:1.2rem;letter-spacing:-.02em}
.logo b{color:var(--blue)}
.links{display:flex;gap:6px;list-style:none}
.links a{display:block;padding:8px 14px;border-radius:999px;color:var(--muted);font-size:.95rem;transition:color .2s,background .2s}
.links a:hover,.links a.active{color:var(--text);background:var(--card)}
.menu-btn{display:none;background:none;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:6px 12px;font-size:1.2rem;cursor:pointer}
.page-head{max-width:1100px;margin:auto;padding:56px 22px 8px}
.page-head h1{font-size:clamp(2.1rem,5vw,3.2rem);letter-spacing:-.035em;line-height:1.1;margin-bottom:10px;
  background:linear-gradient(90deg,var(--blue),var(--violet),var(--amber),var(--blue));background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite;display:inline-block}
@keyframes shine{to{background-position:300% 0}}
.page-head p{color:var(--muted);max-width:56ch}
main{max-width:1100px;margin:auto;padding:30px 22px 70px}
.card{background:rgba(24,33,63,.72);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:var(--radius);padding:24px}
.btn{display:inline-block;padding:12px 22px;border-radius:12px;font-weight:500;border:1px solid var(--line);background:var(--bg-2);color:var(--text);cursor:pointer;font-size:1rem;transition:transform .2s,box-shadow .2s,border-color .2s}
.btn:hover{transform:translateY(-3px);border-color:var(--blue)}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(135deg,var(--blue),var(--violet));color:#07101f;border:0;font-weight:700}
.btn.primary:hover{box-shadow:0 10px 30px rgba(76,201,240,.35)}
footer{border-top:1px solid var(--line);text-align:center;padding:30px 22px;color:var(--muted);font-size:.92rem}
.reveal{opacity:0;transform:translateY(24px);animation:rise .8s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
@media(max-width:820px){
  .menu-btn{display:block}
  .links{position:absolute;top:100%;left:0;right:0;flex-direction:column;background:var(--bg-2);border-bottom:1px solid var(--line);padding:10px 22px;display:none}
  .links.open{display:flex}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}

.tabs{display:inline-flex;gap:6px;background:var(--bg-2);border:1px solid var(--line);border-radius:999px;padding:5px;margin-bottom:24px}
.tab{border:0;background:none;color:var(--muted);padding:9px 20px;border-radius:999px;cursor:pointer;font-size:.95rem;transition:background .25s,color .25s}
.tab.on{background:linear-gradient(135deg,var(--blue),var(--violet));color:#07101f;font-weight:700}
.panel{display:none}.panel.on{display:block;animation:rise .5s ease-out}
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:26px;align-items:start}
.dial{display:flex;flex-direction:column;align-items:center;padding:34px 22px}
.ring{position:relative;width:min(300px,80vw);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{fill:none;stroke:var(--bg-2);stroke-width:12}
.ring .prog{fill:none;stroke:url(#g);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .3s linear}
.dial.running .ring{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{filter:drop-shadow(0 0 18px rgba(76,201,240,.55))}}
.ring .time{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.time strong{font-family:'JetBrains Mono',monospace;font-size:clamp(2.4rem,11vw,3.4rem);letter-spacing:-.04em;font-weight:500}
.time span{color:var(--muted);font-size:.95rem}
.ctrl{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap;justify-content:center}
.presets{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1px solid var(--line);background:var(--bg-2);color:var(--text);padding:9px 16px;border-radius:999px;cursor:pointer;transition:all .2s}
.chip:hover{border-color:var(--blue)}
.chip.on{border-color:var(--violet);background:var(--card);color:var(--amber)}
.custom{display:flex;gap:10px;margin-bottom:24px}
.custom input{width:110px;background:var(--bg-2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:10px 12px;font:inherit}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stat{background:var(--bg-2);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center}
.stat strong{display:block;font-size:2rem;color:var(--amber);letter-spacing:-.03em}
.stat span{color:var(--muted);font-size:.88rem}
.side h2{font-size:1.15rem;margin-bottom:14px}
.laps{list-style:none;display:grid;gap:8px;margin-top:20px;max-height:260px;overflow:auto;width:100%}
.laps li{display:flex;justify-content:space-between;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-family:'JetBrains Mono',monospace;font-size:.9rem;animation:slide .35s ease-out}
@keyframes slide{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,120px);background:var(--card);border:1px solid var(--violet);padding:14px 24px;border-radius:14px;transition:transform .5s cubic-bezier(.2,.8,.2,1);z-index:80}
.toast.show{transform:translate(-50%,0)}
@media(max-width:820px){.stage{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="glow"><span></span><span></span></div>
<header>
  <nav>
    <a href="index.html" class="logo">Prince<b>Raj</b> Hub</a>
    <button class="menu-btn" id="menuBtn" aria-label="Menu">&#9776;</button>
    <ul class="links" id="links">
      <li><a href="index.html">Home</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="coding.html">Coding</a></li>
      <li><a href="calculator.html">Calculator</a></li>
      <li><a href="timer.html" class="active">Timer</a></li>
      <li><a href="notes.html">Notes</a></li>
    </ul>
  </nav>
</header>

<div class="page-head reveal"><h1>Timer</h1><p>Padhai aur kaam ke liye focus timer. Time khatam hone par beep bhi bajega.</p></div>
<main>
  <div class="tabs reveal" style="animation-delay:.1s" role="tablist">
    <button class="tab on" data-p="timer">Focus Timer</button>
    <button class="tab" data-p="stopwatch">Stopwatch</button>
  </div>

  <div class="panel on" id="timer">
    <div class="stage">
      <div class="card dial reveal" id="dial" style="animation-delay:.15s">
        <div class="ring">
          <svg viewBox="0 0 280 280">
            <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4cc9f0"/><stop offset="1" stop-color="#8b7bff"/></linearGradient></defs>
            <circle class="track" cx="140" cy="140" r="118"/>
            <circle class="prog" id="prog" cx="140" cy="140" r="118"/>
          </svg>
          <div class="time"><strong id="clock">25:00</strong><span id="label">Focus</span></div>
        </div>
        <div class="ctrl">
          <button class="btn primary" id="startBtn">Start</button>
          <button class="btn" id="resetBtn">Reset</button>
        </div>
      </div>
      <div class="card side reveal" style="animation-delay:.25s">
        <h2>Mode chuno</h2>
        <div class="presets" id="presets">
          <button class="chip on" data-m="25" data-l="Focus">Focus 25</button>
          <button class="chip" data-m="5" data-l="Short break">Break 5</button>
          <button class="chip" data-m="15" data-l="Long break">Break 15</button>
        </div>
        <div class="custom">
          <input type="number" id="customMin" min="1" max="180" placeholder="Minutes" aria-label="Custom minutes">
          <button class="btn" id="setCustom">Set karein</button>
        </div>
        <div class="stats">
          <div class="stat"><strong id="sessions">0</strong><span>Sessions</span></div>
          <div class="stat"><strong id="mins">0</strong><span>Focus minutes</span></div>
        </div>
      </div>
    </div>
  </div>

  <div class="panel" id="stopwatch">
    <div class="card dial" style="max-width:560px">
      <div class="time" style="text-align:center"><strong id="swClock" style="font-size:clamp(2.6rem,12vw,4rem)">00:00.00</strong></div>
      <div class="ctrl">
        <button class="btn primary" id="swStart">Start</button>
        <button class="btn" id="swLap">Lap</button>
        <button class="btn" id="swReset">Reset</button>
      </div>
      <ul class="laps" id="laps"></ul>
    </div>
  </div>
</main>
<div class="toast" id="toast"></div>

<footer>&copy; <span id="year"></span> PrinceRaj Hub. Made with &#10084;&#65039; by Prince Raj</footer>
<script>
document.getElementById('menuBtn').addEventListener('click',()=>document.getElementById('links').classList.toggle('open'));
document.getElementById('year').textContent=new Date().getFullYear();

const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
// Tabs
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id===t.dataset.p));
}));
// Toast + beep
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3500)}
function beep(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    [0,.35,.7].forEach(d=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.frequency.value=880;o.connect(g);g.connect(ctx.destination);
      g.gain.setValueAtTime(.2,ctx.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d+.3);
      o.start(ctx.currentTime+d);o.stop(ctx.currentTime+d+.3);
    });
  }catch(e){}
}
// Saved stats
let sessions=0,focusMins=0;
try{sessions=+localStorage.getItem('pr_sessions')||0;focusMins=+localStorage.getItem('pr_mins')||0}catch(e){}
function saveStats(){try{localStorage.setItem('pr_sessions',sessions);localStorage.setItem('pr_mins',focusMins)}catch(e){}$('sessions').textContent=sessions;$('mins').textContent=focusMins}
saveStats();
// Timer
const C=2*Math.PI*118,prog=$('prog');
prog.style.strokeDasharray=C;
let total=25*60,left=total,running=false,endAt=0,iv=null,isFocus=true;
function draw(){
  $('clock').textContent=pad(Math.floor(left/60))+':'+pad(left%60);
  prog.style.strokeDashoffset=C*(1-left/total);
  document.title=(running?pad(Math.floor(left/60))+':'+pad(left%60)+' | ':"")+'Timer | PrinceRaj Hub';
}
function tick(){
  left=Math.max(0,Math.ceil((endAt-Date.now())/1000));draw();
  if(left===0){
    stop();beep();
    if(isFocus){sessions++;focusMins+=Math.round(total/60);saveStats();toast('Shabash! Focus session poora hua.')}
    else toast('Break khatam. Wapas kaam par.');
    $('startBtn').textContent='Start';
  }
}
function start(){
  if(left<=0)left=total;
  endAt=Date.now()+left*1000;running=true;
  iv=setInterval(tick,250);
  $('dial').classList.add('running');$('startBtn').textContent='Pause';
}
function stop(){running=false;clearInterval(iv);$('dial').classList.remove('running');$('startBtn').textContent='Start';draw()}
$('startBtn').addEventListener('click',()=>running?stop():start());
$('resetBtn').addEventListener('click',()=>{stop();left=total;draw()});
function setMode(min,label,focus){stop();total=min*60;left=total;isFocus=focus;$('label').textContent=label;draw()}
$('presets').addEventListener('click',e=>{
  const c=e.target.closest('.chip');if(!c)return;
  document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c));
  setMode(+c.dataset.m,c.dataset.l,c.dataset.l==='Focus');
});
$('setCustom').addEventListener('click',()=>{
  const m=Math.min(180,Math.max(1,parseInt($('customMin').value,10)));
  if(!m)return toast('1 se 180 ke beech minutes likho.');
  document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
  setMode(m,'Custom '+m+' min',true);
});
draw();
// Stopwatch
let swRun=false,swStartT=0,swElapsed=0,swIv=null,lapCount=0;
function swFmt(ms){const cs=Math.floor(ms/10)%100,s=Math.floor(ms/1000)%60,m=Math.floor(ms/60000);return pad(m)+':'+pad(s)+'.'+pad(cs)}
function swDraw(){const now=swRun?swElapsed+(performance.now()-swStartT):swElapsed;$('swClock').textContent=swFmt(now);return now}
$('swStart').addEventListener('click',()=>{
  if(swRun){swElapsed+=performance.now()-swStartT;swRun=false;clearInterval(swIv);$('swStart').textContent='Start'}
  else{swStartT=performance.now();swRun=true;swIv=setInterval(swDraw,30);$('swStart').textContent='Stop'}
  swDraw();
});
$('swLap').addEventListener('click',()=>{
  if(!swRun)return;
  const li=document.createElement('li');lapCount++;
  li.innerHTML='<span></span><span></span>';
  li.children[0].textContent='Lap '+lapCount;li.children[1].textContent=swFmt(swDraw());
  $('laps').prepend(li);
});
$('swReset').addEventListener('click',()=>{swRun=false;clearInterval(swIv);swElapsed=0;lapCount=0;$('laps').innerHTML='';$('swStart').textContent='Start';swDraw()});
</script>
</body>
</html>

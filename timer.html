<!DOCTYPE html>
<html>
<head>
  <title>Timer App</title>
  <style>
    body{
      background:#0f172a;
      color:white;
      text-align:center;
      font-family:Arial;
      padding-top:50px;
    }
    button{
      padding:10px 15px;
      margin:5px;
      font-size:16px;
    }
  </style>
</head>
<body>

<h2>⏱ Timer App</h2>
<h1 id="time">0</h1>

<button onclick="start()">Start</button>
<button onclick="stop()">Stop</button>
<button onclick="reset()">Reset</button>

<br><br>
<a href="projects.html" style="color:#38bdf8;">← Back to Projects</a>

<script>
let t = 0;
let timer;

function start(){
  if(!timer){
    timer = setInterval(()=>{
      t++;
      document.getElementById("time").innerText = t;
    },1000);
  }
}
function stop(){
  clearInterval(timer);
  timer = null;
}
function reset(){
  stop();
  t = 0;
  document.getElementById("time").innerText = t;
}
</script>

</body>
</html>
